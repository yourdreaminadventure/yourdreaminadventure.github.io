<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Character</title>
    <link rel="stylesheet" href="customcharacter.css">
</head>

<body>

    <form class="form" action="gopremium.html">
        <h2 class="h2">Create your custom character</h1>
            <input type="input" placeholder="Enter character name" class="input-box" required="true">
            
            <p>Please select your Gender:</p>
            <input type="radio" id="boy" name="age" value="boy">
            <label for="age1">Boy</label><br>
            <input type="radio" id="girl" name="age" value="girl" required="true">
            <label for="age2">Girl</label>
            <br>
            <input type="input" placeholder="Enter character Dream Job" class="input-box" required="true">
            <br>
            <label for="imageUpload">Upload Image:</label>
            <input style="margin: auto;" type="file" id="imageUpload" name="image" accept="image/*" required="true">
            <br>
            <button class="btn" type="submit">
                <svg height="24" width="24" fill="#FFFFFF" viewBox="0 0 24 24" data-name="Layer 1" id="Layer_1"
                    class="sparkle">
                    <path
                        d="M10,21.236,6.755,14.745.264,11.5,6.755,8.255,10,1.764l3.245,6.491L19.736,11.5l-6.491,3.245ZM18,21l1.5,3L21,21l3-1.5L21,18l-1.5-3L18,18l-3,1.5ZM19.333,4.667,20.5,7l1.167-2.333L24,3.5,21.667,2.333,20.5,0,19.333,2.333,17,3.5Z">
                    </path>
                </svg>

                <span class="text">Go Premium</span>
            </button>
    </form>
</body>

</html>
