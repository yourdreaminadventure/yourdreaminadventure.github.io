</head>
<body>
    <nav style="overflow: hidden;background-color: #333;font-family: Arial, Helvetica, sans-serif;position: sticky;top: 0;z-index: 1000;width: 100%;margin: 0;padding: 0;box-sizing: border-box;box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);text-decoration: none;list-style: none;display: flex;justify-content: center;align-items: center;height: 10vh;font-size: 1.2rem;font-weight: bold;color: white;text-transform: uppercase;letter-spacing: 0.1rem;padding: 1cm;"><a style="padding-right: 8cm; text-decoration: none;color: white;" href="index.html"> Home Page </a><br><a style="padding-right: 8cm; text-decoration: none;color: white;" href="signup.html"> Sign Up </a><br><a style="padding-right: 8cm; text-decoration: none; color: white;" href="contactus.html"> Contact Us </a><br><a style="text-decoration: none; color: white;" href="/ar/index.html"> العربيه </a><br></nav>
    <div class="title">
        <h1>Welcome To Your Dream In Adventure Website</h1>
    </div>
<div class = "form">
    <form method="post" action="careers.html">
        <h1 class="signuptxt">Sign Up</h1>
            <label for="uname">Username:</label>
            <br>
            <input class="username" id="username" type="text" name="username" required>
            <br>
            <label for="pword">Password:</label>
            <br>
            <input class="pword" type="password" name="password" required>
            <br>
            <label for="emaail">E-Mail:</label>
            <br>
            <input class="emaail" type="email" name="email" required>
            <br>
        <button class="button" type="submit">
        <span class="label">Sign Up</span>
        <span class="gradient-container">
        <span class="gradient"></span>
        </span>
        </button>
        <button class="button" onclick="window.location.href='careers.html'">
        <span class="label">Skip</span>
        <span class="gradient-container">
        <span class="gradient"></span>
        </span>
        </button>
    </form>
    <img src="readyforadventure.png" alt="Ready For Adventure" class="adventureimg" draggable="false">
    
</body>
</html>
